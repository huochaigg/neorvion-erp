[project]
name = "neorvion-db"
version = "0.1.0"
description = "Neorvion 多租户数据库会话与模型隔离登记。不包含 JWT 或权限快照。"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neorvion_db"]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "pytest>=8.4.2",
    "ruff>=0.13.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["neorvion_db", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
