[project]
name = "neorvion-security"
version = "0.1.0"
description = "Neorvion shared JWT/JWKS verification, tenant context and RBAC snapshot helpers"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45.0.7",
    "pyjwt>=2.10.1",
    "redis>=6.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neorvion_security"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
