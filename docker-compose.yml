services:
  mysql:
    image: mysql:8.4
    container_name: neorvion-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-neorvion_erp}
      MYSQL_USER: ${MYSQL_USER:-neorvion}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-neorvion_dev}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-lock-wait-timeout=5
    volumes:
      - neorvion_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uneorvion", "-pneorvion_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: neorvion-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - neorvion_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: neorvion-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8011
      SECRET_KEY: ${SECRET_KEY:-change-me-in-local-dev}
      JWT_ACCESS_EXPIRE_MINUTES: 30
      JWT_REFRESH_EXPIRE_DAYS: 7
      REFRESH_COOKIE_NAME: neorvion_refresh
      REFRESH_COOKIE_PATH: /api/v1/auth
      REFRESH_COOKIE_SAMESITE: lax
      REFRESH_COOKIE_SECURE: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8015,http://localhost:8016,http://127.0.0.1:8015,http://127.0.0.1:8016}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-neorvion}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-neorvion_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-neorvion_erp}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
    ports:
      - "8011:8011"
    command: >
      sh -c "uv run --no-dev alembic upgrade head &&
             uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8011"

  nginx:
    image: nginx:1.27-alpine
    container_name: neorvion-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    profiles:
      - gateway

volumes:
  neorvion_mysql_data:
  neorvion_redis_data:
