services:
  mysql:
    image: mysql:8.4
    container_name: neorvion-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-neorvion_erp}
      MYSQL_USER: ${MYSQL_USER:-neorvion}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-neorvion_dev}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-lock-wait-timeout=5
    volumes:
      - neorvion_mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-iam.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uneorvion", "-pneorvion_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: neorvion-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - neorvion_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  iam:
    build:
      context: .
      dockerfile: services/iam/Dockerfile
    container_name: neorvion-iam
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8010
      JWT_ISSUER: neorvion-iam
      JWT_AUDIENCES: neorvion-iam,neorvion-erp,neorvion-knowledge,neorvion-copilot
      JWT_KEY_ID: jwt-v1
      JWT_PRIVATE_KEY_PATH: secrets/jwt/v1/private.pem
      JWT_PUBLIC_KEY_PATH: secrets/jwt/v1/public.pem
      JWT_ACCESS_EXPIRE_MINUTES: 30
      JWT_REFRESH_EXPIRE_DAYS: 7
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8015,http://localhost:8016,http://localhost:8017,http://localhost:8018,http://localhost:8019,http://127.0.0.1:8015,http://127.0.0.1:8016,http://127.0.0.1:8017,http://127.0.0.1:8018,http://127.0.0.1:8019}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-neorvion}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-neorvion_dev}
      MYSQL_DATABASE: neorvion_iam
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 1
      PERMISSION_SYNC_KEY: ${PERMISSION_SYNC_KEY:-}
      INTERNAL_SERVICE_KEY: ${IAM_INTERNAL_KEY:-}
    volumes:
      - ./services/iam/secrets:/app/secrets:ro
    ports:
      - "8010:8010"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    command: >
      sh -c "uv run --no-dev alembic upgrade head &&
             uv run --no-dev python -m app.scripts.seed_permissions &&
             uv run --no-dev python -m app.scripts.bootstrap_platform_admin &&
             uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8010"

  erp:
    build:
      context: .
      dockerfile: services/erp/Dockerfile
    container_name: neorvion-erp
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      iam:
        condition: service_started
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8011
      IAM_JWT_ISSUER: neorvion-iam
      IAM_JWT_AUDIENCE: neorvion-erp
      IAM_JWKS_URL: http://iam:8010/.well-known/jwks.json
      IAM_AUTHORIZE_URL: http://iam:8010/api/v1/internal/authorize
      IAM_INTERNAL_KEY: ${IAM_INTERNAL_KEY:-}
      COPILOT_EXECUTION_SECRET: ${COPILOT_EXECUTION_SECRET:-}
      IAM_REDIS_HOST: redis
      IAM_REDIS_PORT: 6379
      IAM_REDIS_DB: 1
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8015,http://localhost:8016,http://localhost:8018,http://127.0.0.1:8015,http://127.0.0.1:8016,http://127.0.0.1:8018}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-neorvion}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-neorvion_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-neorvion_erp}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
    ports:
      - "8011:8011"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    command: >
      sh -c "uv run --no-dev alembic upgrade head &&
             uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8011"

  worker:
    build:
      context: .
      dockerfile: services/erp/Dockerfile
    container_name: neorvion-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      IAM_JWT_ISSUER: neorvion-iam
      IAM_JWT_AUDIENCE: neorvion-erp
      IAM_JWKS_URL: http://iam:8010/.well-known/jwks.json
      IAM_AUTHORIZE_URL: http://iam:8010/api/v1/internal/authorize
      IAM_INTERNAL_KEY: ${IAM_INTERNAL_KEY:-}
      IAM_REDIS_HOST: redis
      IAM_REDIS_PORT: 6379
      IAM_REDIS_DB: 1
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-neorvion}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-neorvion_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-neorvion_erp}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
    command: uv run --no-dev python -m app.tasks.worker

  postgres:
    image: pgvector/pgvector:pg16
    container_name: neorvion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-neorvion_knowledge}
      COPILOT_POSTGRES_USER: ${COPILOT_POSTGRES_USER:-neorvion_copilot}
      COPILOT_POSTGRES_PASSWORD: ${COPILOT_POSTGRES_PASSWORD:-change-me}
      COPILOT_POSTGRES_DB: ${COPILOT_POSTGRES_DB:-neorvion_copilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - neorvion_postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/00-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  knowledge:
    build:
      context: .
      dockerfile: services/knowledge/Dockerfile
    container_name: neorvion-knowledge
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      iam:
        condition: service_started
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8012
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-neorvion_knowledge}
      IAM_JWT_ISSUER: neorvion-iam
      IAM_JWT_AUDIENCE: neorvion-knowledge
      IAM_JWKS_URL: http://iam:8010/.well-known/jwks.json
      IAM_AUTHORIZE_URL: http://iam:8010/api/v1/internal/authorize
      IAM_INTERNAL_KEY: ${IAM_INTERNAL_KEY:-}
      IAM_REDIS_URL: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8015,http://localhost:8017,http://localhost:8018,http://127.0.0.1:8015,http://127.0.0.1:8017,http://127.0.0.1:8018}
      MODEL_PROVIDER: mock
      TASK_EXECUTOR: inline
    ports:
      - "8012:8012"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    command: >
      sh -c "uv run --no-dev alembic upgrade head &&
             uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8012 --proxy-headers --forwarded-allow-ips=127.0.0.1"

  copilot:
    build:
      context: .
      dockerfile: services/copilot/Dockerfile
    container_name: neorvion-copilot
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      iam:
        condition: service_started
      erp:
        condition: service_healthy
      knowledge:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8013
      IAM_JWT_ISSUER: neorvion-iam
      IAM_JWT_AUDIENCE: neorvion-copilot
      IAM_JWKS_URL: http://iam:8010/.well-known/jwks.json
      IAM_REDIS_URL: redis://redis:6379/1
      IAM_SERVICE_TOKEN_URL: http://iam:8010/api/v1/service-tokens
      DATABASE_URL: postgresql+psycopg://${COPILOT_POSTGRES_USER:-neorvion_copilot}:${COPILOT_POSTGRES_PASSWORD:-change-me}@postgres:5432/${COPILOT_POSTGRES_DB:-neorvion_copilot}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8015,http://localhost:8018,http://localhost:8019,http://127.0.0.1:8015,http://127.0.0.1:8018,http://127.0.0.1:8019}
      MODEL_PROVIDER: ${COPILOT_MODEL_PROVIDER:-openai_compat}
      CHAT_BASE_URL: ${COPILOT_CHAT_BASE_URL:-https://api.deepseek.com}
      CHAT_API_KEY: ${COPILOT_CHAT_API_KEY:-}
      CHAT_MODEL: ${COPILOT_CHAT_MODEL:-deepseek-chat}
      ERP_BASE_URL: http://erp:8011
      ERP_JWT_AUDIENCE: neorvion-erp
      ERP_EXECUTION_SECRET: ${COPILOT_EXECUTION_SECRET:-}
      ACTION_GRAPH_ENABLED: "true"
      KNOWLEDGE_BASE_URL: ${COPILOT_KNOWLEDGE_BASE_URL:-http://knowledge:8012}
      KNOWLEDGE_JWT_AUDIENCE: neorvion-knowledge
      KNOWLEDGE_TOP_K_MAX: ${COPILOT_KNOWLEDGE_TOP_K_MAX:-8}
      KNOWLEDGE_EVIDENCE_EXCERPT_CHARS: ${COPILOT_KNOWLEDGE_EVIDENCE_EXCERPT_CHARS:-600}
      TOOL_MAX_ROUNDS: ${COPILOT_TOOL_MAX_ROUNDS:-5}
      TOOL_MAX_CALLS: ${COPILOT_TOOL_MAX_CALLS:-8}
      TOOL_TOTAL_TIMEOUT_SECONDS: ${COPILOT_TOOL_TOTAL_TIMEOUT_SECONDS:-30}
      TOOL_MAX_RESULT_CHARS: ${COPILOT_TOOL_MAX_RESULT_CHARS:-12000}
      WORKFLOW_REDIS_URL: redis://redis:6379/0
      WORKFLOW_QUEUE_KEY: ${COPILOT_WORKFLOW_QUEUE_KEY:-copilot:workflows:v1}
      MULTI_AGENT_ENABLED: ${COPILOT_MULTI_AGENT_ENABLED:-true}
      MULTI_AGENT_MAX_PARALLEL: ${COPILOT_MULTI_AGENT_MAX_PARALLEL:-3}
      EVALUATION_QUEUE_KEY: ${COPILOT_EVALUATION_QUEUE_KEY:-copilot:evaluations:v1}
      EVALUATION_TRACE_RETENTION_DAYS: ${COPILOT_EVALUATION_TRACE_RETENTION_DAYS:-90}
      QUOTA_ENFORCEMENT_ENABLED: ${COPILOT_QUOTA_ENFORCEMENT_ENABLED:-false}
      MCP_REMOTE_EXECUTION_ENABLED: ${COPILOT_MCP_REMOTE_EXECUTION_ENABLED:-false}
      MCP_ALLOWED_HOSTS: ${COPILOT_MCP_ALLOWED_HOSTS:-}
      MCP_EGRESS_PROXY_URL: ${COPILOT_MCP_EGRESS_PROXY_URL:-}
      MCP_NETWORK_ISOLATION_ACKNOWLEDGED: ${COPILOT_MCP_NETWORK_ISOLATION_ACKNOWLEDGED:-false}
      MCP_BUDGET_GATE_VERIFIED: ${COPILOT_MCP_BUDGET_GATE_VERIFIED:-false}
    ports:
      - "8013:8013"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8013/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  copilot-worker:
    build:
      context: .
      dockerfile: services/copilot/Dockerfile
    container_name: neorvion-copilot-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      erp:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${COPILOT_POSTGRES_USER:-neorvion_copilot}:${COPILOT_POSTGRES_PASSWORD:-change-me}@postgres:5432/${COPILOT_POSTGRES_DB:-neorvion_copilot}
      ERP_BASE_URL: ${COPILOT_ERP_BASE_URL:-http://erp:8011}
      ERP_EXECUTION_SECRET: ${COPILOT_EXECUTION_SECRET:-}
      WORKFLOW_REDIS_URL: redis://redis:6379/0
      WORKFLOW_QUEUE_KEY: ${COPILOT_WORKFLOW_QUEUE_KEY:-copilot:workflows:v1}
      WORKFLOW_LEASE_SECONDS: ${COPILOT_WORKFLOW_LEASE_SECONDS:-45}
      WORKFLOW_MAX_ATTEMPTS: ${COPILOT_WORKFLOW_MAX_ATTEMPTS:-3}
      WORKFLOW_RECONCILE_MAX_ATTEMPTS: ${COPILOT_WORKFLOW_RECONCILE_MAX_ATTEMPTS:-6}
    command: python -m app.tasks.worker

  copilot-evaluation-worker:
    build:
      context: .
      dockerfile: services/copilot/Dockerfile
    container_name: neorvion-copilot-evaluation-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${COPILOT_POSTGRES_USER:-neorvion_copilot}:${COPILOT_POSTGRES_PASSWORD:-change-me}@postgres:5432/${COPILOT_POSTGRES_DB:-neorvion_copilot}
      WORKFLOW_REDIS_URL: redis://redis:6379/0
      EVALUATION_QUEUE_KEY: ${COPILOT_EVALUATION_QUEUE_KEY:-copilot:evaluations:v1}
      EVALUATION_LEASE_SECONDS: ${COPILOT_EVALUATION_LEASE_SECONDS:-60}
      EVALUATION_MAX_CONCURRENCY: ${COPILOT_EVALUATION_MAX_CONCURRENCY:-2}
      EVALUATION_TRACE_RETENTION_DAYS: ${COPILOT_EVALUATION_TRACE_RETENTION_DAYS:-90}
      IAM_SERVICE_TOKEN_URL: http://iam:8010/api/v1/service-tokens
      EVALUATION_SERVICE_ID: ${COPILOT_EVALUATION_SERVICE_ID:-}
      EVALUATION_SERVICE_SECRET: ${COPILOT_EVALUATION_SERVICE_SECRET:-}
    command: python -m app.tasks.evaluation_worker

  copilot-insight-scheduler:
    build:
      context: .
      dockerfile: services/copilot/Dockerfile
    container_name: neorvion-copilot-insight-scheduler
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      iam:
        condition: service_started
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${COPILOT_POSTGRES_USER:-neorvion_copilot}:${COPILOT_POSTGRES_PASSWORD:-change-me}@postgres:5432/${COPILOT_POSTGRES_DB:-neorvion_copilot}
      WORKFLOW_REDIS_URL: redis://redis:6379/0
      INSIGHT_SCHEDULER_ENABLED: ${COPILOT_INSIGHT_SCHEDULER_ENABLED:-false}
      INSIGHT_QUEUE_KEY: ${COPILOT_INSIGHT_QUEUE_KEY:-copilot:insights:v1}
      INSIGHT_SERVICE_ID: ${COPILOT_INSIGHT_SERVICE_ID:-}
      INSIGHT_SERVICE_SECRET: ${COPILOT_INSIGHT_SERVICE_SECRET:-}
    command: python -m app.tasks.insight_scheduler

  copilot-insight-worker:
    build:
      context: .
      dockerfile: services/copilot/Dockerfile
    container_name: neorvion-copilot-insight-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      iam:
        condition: service_started
      erp:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${COPILOT_POSTGRES_USER:-neorvion_copilot}:${COPILOT_POSTGRES_PASSWORD:-change-me}@postgres:5432/${COPILOT_POSTGRES_DB:-neorvion_copilot}
      WORKFLOW_REDIS_URL: redis://redis:6379/0
      IAM_SERVICE_TOKEN_URL: http://iam:8010/api/v1/service-tokens
      ERP_BASE_URL: http://erp:8011
      ERP_JWT_AUDIENCE: neorvion-erp
      INSIGHT_SCHEDULER_ENABLED: ${COPILOT_INSIGHT_SCHEDULER_ENABLED:-false}
      INSIGHT_QUEUE_KEY: ${COPILOT_INSIGHT_QUEUE_KEY:-copilot:insights:v1}
      INSIGHT_SERVICE_ID: ${COPILOT_INSIGHT_SERVICE_ID:-}
      INSIGHT_SERVICE_SECRET: ${COPILOT_INSIGHT_SERVICE_SECRET:-}
      INSIGHT_LEASE_SECONDS: ${COPILOT_INSIGHT_LEASE_SECONDS:-60}
      INSIGHT_MAX_CONCURRENCY: ${COPILOT_INSIGHT_MAX_CONCURRENCY:-2}
      INSIGHT_MAX_ATTEMPTS: ${COPILOT_INSIGHT_MAX_ATTEMPTS:-3}
    command: python -m app.tasks.insight_worker

  nginx:
    image: nginx:1.27-alpine
    container_name: neorvion-nginx
    restart: unless-stopped
    depends_on:
      - iam
      - erp
      - knowledge
      - copilot
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    profiles:
      - gateway

volumes:
  neorvion_mysql_data:
  neorvion_redis_data:
  neorvion_postgres_data:
