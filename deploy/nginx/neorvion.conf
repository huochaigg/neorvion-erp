# 宝塔网站 Nginx 配置模板。
# 【宝塔网页】网站 → 对应站点 → 设置 → 配置文件
# 用本文件替换默认 server { }，或把 location 块复制进去。
# 改完先在 SSH 执行：/www/server/nginx/sbin/nginx -t
# 通过后再 reload，不要配置错误直接 restart。
#
# 真实 API 端口是 8011（项目 APP_PORT），不是 8001。
# 不要把 /api 回退成 index.html。
# 不要现在配置 /api/agent/（服务还不存在，会 502）。

server {
    listen 80;
    listen [::]:80;
    server_name neorvion.com www.neorvion.com;
    # 申请 Let's Encrypt 后，宝塔会自动增加 443 与 redirect。不要手工重复 listen 443。

    root /opt/neorvion/current/shell;
    index index.html;

    client_max_body_size 20m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location = /health-frontend {
        default_type text/plain;
        return 200 "shell-ok\n";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8011/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8011/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8011/openapi.json;
        proxy_set_header Host $host;
    }

    # ERP 子应用静态资源。base=/erp/ 。刷新 /erp/orders 不能 404。
    location /erp/ {
        alias /opt/neorvion/current/erp/;
        try_files $uri $uri/ @erp_spa;
    }

    location @erp_spa {
        rewrite ^ /erp/index.html last;
    }

    location ^~ /erp/assets/ {
        alias /opt/neorvion/current/erp/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /assets/ {
        root /opt/neorvion/current/shell;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 未来 Agent SSE 不要写进当前生效配置。示例：
    # location /api/agent/ {
    #     proxy_pass http://127.0.0.1:8021;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_buffering off;
    #     proxy_cache off;
    #     proxy_read_timeout 3600s;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }
}

# WebSocket / 长连接以后按具体路径单独加，不要给全部 /api 开 1 小时超时。
