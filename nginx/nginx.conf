server {
    listen 80;
    server_name localhost;

    client_max_body_size 20m;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location /.well-known/ {
        proxy_pass http://iam:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/crypto/ {
        proxy_pass http://iam:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/ {
        proxy_pass http://iam:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location /api/v1/tenants {
        proxy_pass http://iam:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
    }

    location /api/v1/roles {
        proxy_pass http://iam:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
    }

    location /api/v1/permissions {
        proxy_pass http://iam:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
    }

    location /api/v1/users {
        proxy_pass http://iam:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
    }

    location /api/v1/applications {
        proxy_pass http://iam:8010;
        proxy_set_header Host $host;
    }

    location /api/v1/menus {
        proxy_pass http://iam:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
    }

    location /api/v1/audit-logs {
        proxy_pass http://iam:8010;
        proxy_set_header Host $host;
    }

    location /api/v1/sessions {
        proxy_pass http://iam:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
    }

    location /api/v1/internal/ {
        proxy_pass http://iam:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Internal-Key $http_x_internal_key;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/v1/knowledge-bases {
        proxy_pass http://knowledge:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/v1/documents {
        proxy_pass http://knowledge:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/v1/search {
        proxy_pass http://knowledge:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/v1/conversations {
        proxy_pass http://knowledge:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/v1/evaluation {
        proxy_pass http://knowledge:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/v1/retrieval {
        proxy_pass http://knowledge:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/v1/models {
        proxy_pass http://knowledge:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/v1/chunks {
        proxy_pass http://knowledge:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/v1/recycle {
        proxy_pass http://knowledge:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/v1/stats {
        proxy_pass http://knowledge:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/ {
        proxy_pass http://erp:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
    }

    location /docs {
        proxy_pass http://iam:8010/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://iam:8010/openapi.json;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://host.docker.internal:8015;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
